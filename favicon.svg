<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
    </defs>
    <!-- Background Rounded Square -->
    <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top-Left QR Eye -->
    <rect x="10" y="10" width="18" height="18" rx="5" stroke="url(#qrGrad)" stroke-width="3" fill="none" />
    <rect x="15" y="15" width="8" height="8" rx="2" fill="url(#qrGrad)" />

    <!-- Top-Right QR Eye -->
    <rect x="36" y="10" width="18" height="18" rx="5" stroke="url(#qrGrad)" stroke-width="3" fill="none" />
    <rect x="41" y="15" width="8" height="8" rx="2" fill="url(#qrGrad)" />

    <!-- Bottom-Left QR Eye -->
    <rect x="10" y="36" width="18" height="18" rx="5" stroke="url(#qrGrad)" stroke-width="3" fill="none" />
    <rect x="15" y="41" width="8" height="8" rx="2" fill="url(#qrGrad)" />

    <!-- Center & Bottom-Right Modern Data Modules / Spark -->
    <rect x="36" y="36" width="6" height="6" rx="1.5" fill="#38bdf8" />
    <rect x="48" y="36" width="6" height="6" rx="1.5" fill="url(#qrGrad)" />
    <rect x="36" y="48" width="6" height="6" rx="1.5" fill="url(#qrGrad)" />
    <rect x="44" y="44" width="10" height="10" rx="3" fill="#22c55e" />
    
    <!-- Center Spark Accent -->
    <circle cx="32" cy="32" r="3" fill="#38bdf8" />
</svg>
